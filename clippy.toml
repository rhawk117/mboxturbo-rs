msrv = "1.98"
avoid-breaking-exported-api = false

# Tests may panic: a panic is a test failure (rust-tests.md). Silent fallbacks stay banned there.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Parity with ruff.toml (mccabe 6, max-statements 20, max-args 4, max-nested-blocks 2).
cognitive-complexity-threshold = 7
too-many-lines-threshold = 30
too-many-arguments-threshold = 4
excessive-nesting-threshold = 4
max-fn-params-bools = 0
max-struct-bools = 1
type-complexity-threshold = 150
max-suggested-slice-pattern-length = 3
enum-variant-size-threshold = 128
large-error-threshold = 64

# Identifiers say what they hold: no single-letter names, not even i, x or n.
min-ident-chars-threshold = 1
allowed-idents-below-min-chars = []
absolute-paths-max-segments = 2

disallowed-methods = [
    { path = "core::option::Option::unwrap_or_default", reason = "a default hides a missing value: propagate it, or #[expect] with why the default is correct (rust.md 1)" },
    { path = "core::result::Result::unwrap_or_default", reason = "a default hides the error: propagate it with ?, or #[expect] with why the default is correct (rust.md 1)" },
    { path = "core::result::Result::ok", reason = "discards the error: propagate it with ?, or #[expect] with why None is the right answer (rust.md 1)" },
    { path = "core::result::Result::unwrap_or", reason = "a fallback hides the error: propagate it, or #[expect] with why the fallback is correct (rust.md 1)" },
    { path = "core::convert::identity", reason = "unwrap_or_else(identity) swallows the error variant (rust.md 1)" },
    { path = "std::panic::catch_unwind", reason = "containing a panic hides a bug: #[expect] with the upstream bug being contained (rust.md 1)" },
    { path = "u8::strict_add", reason = "strict_* panics on overflow: use checked_/saturating_ and handle it, or #[expect] with the bound that makes overflow impossible (rust.md 3)" },
