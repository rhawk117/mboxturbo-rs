[project]
name = "mboxturbo-cli"
description = "Command-line exporter for large mbox files"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "rhawk117", email = "noplaceLike127dot0dot0dot1@proton.me" }]
requires-python = ">=3.14"
dynamic = ["version"]

[tool.maturin]
bindings = "bin"
profile = "release"

[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"
