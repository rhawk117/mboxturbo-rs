[package]
name = "mboxturbo"
description = "Offset-indexed random access, parallel indexing and zero-copy parsing for large mbox files"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
arrow-array = { version = "60.1", features = ["ffi"] }
arrow-schema = "60.1"
mail-parser = { version = "=1.0.1", features = ["full_encoding"] }
memchr = "2.8.3"
memmap2 = "0.9.12"
parquet = { version = "60.1", default-features = false, features = ["arrow", "zstd", "snap"] }
rayon = "1.12.0"
self_cell = "1.3.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
