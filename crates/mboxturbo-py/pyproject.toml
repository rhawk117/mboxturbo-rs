[project]
name = "mboxturbo"
version = "0.1.0"
description = "Offset-indexed random access, parallel indexing and Rust-parsed messages for large mbox files"
readme = "README.md"
license = "MIT"
authors = [{ name = "rhawk117", email = "noplaceLike127dot0dot0dot1@proton.me" }]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6",
    "maturin>=1.16.0",
    "pytest>=9",
    "ruff>=0.16.10",
    "ty>=0.0.99",
]

[tool.maturin]
module-name = "mboxturbo._core"
python-packages = ["mboxturbo"]
python-source = "src"
profile = "release"
exclude = ["src/mboxturbo/tests/**"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-p", "mboxturbo.tests.fixtures"]
testpaths = ["tests"]
xfail_strict = true
markers = [
    "integration: exercises the compiled extension against files on disk",
    "regression: pins a bug that was fixed",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.rs" },
    { file = "Cargo.toml" },
    { file = "../mboxturbo/src/**/*.rs" },
    { file = "../mboxturbo/Cargo.toml" },
    { file = "../../Cargo.lock" },
]

[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"
