name: Continuous Integration (CI)
on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read # fallback for any job without its own permissions block (every current job declares one)

concurrency:
  group: mboxturbo-ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  labeler:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: 📎 Label Pull Request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
      pull-requests: write # actions/labeler applies labels to the pull request
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply Labels (labeler.yml)
        id: apply-labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          sync-labels: true
          dot: true

      - name: Summarize PR Labels
        if: ${{ !cancelled() }}
        run: bash ./.github/scripts/label-summary.sh
        env:
          LABELER_OUTCOME: ${{ steps.apply-labels.outcome }}
          NEW_LABELS: ${{ steps.apply-labels.outputs.new-labels }}
          ALL_LABELS: ${{ steps.apply-labels.outputs.all-labels }}

  prek:
    name: 🧹 Lint (prek)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ vars.UV_VERSION }}
          cache-dependency-glob: uv.lock

      - name: Install Pinned Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Pinned Nightly rustfmt (prek.toml)
        run: rustup toolchain install nightly-2026-10-15 --profile minimal --component rustfmt

      - name: Restore Cargo Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: prek

      - name: Install cargo-deny and cargo-machete
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny,cargo-machete

      - name: Synchronize Lint Tools
        run: uv sync --locked --no-install-project

      - name: Run Every Hook
        run: uv run --no-sync prek run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

  rust-checks:
    name: 🦀 Rust Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Pinned Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Restore Cargo Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .

      - name: Run Workspace Tests
        run: cargo test --workspace --locked

  python-checks:
    name: 🐍 Python Checks (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout and code scanning upload
      actions: read # code scanning upload on private repositories (pysentry action)
      security-events: write # pysentry action uploads SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            groups: --group dev --group polars
          - python: "3.14t"
            groups: --group dev
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ vars.UV_VERSION }}
          cache-dependency-glob: uv.lock

      - name: Install Pinned Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Restore Cargo Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: python-${{ matrix.python }}

      - name: 🔒 Supply Chain Audit
        if: ${{ matrix.python == '3.14' }}
        uses: ./.github/actions/pysentry # zizmor: ignore[self-repository] remove once actionlint supports '$/' (rhysd/actionlint#711)
        with:
          uv-version: ${{ vars.UV_VERSION }}
          project-directory: .
          upload-sarif: ${{ github.event.repository.fork != true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

      - name: Build Extension and Synchronize Dependencies
        run: |
          read -ra dependency_groups <<<"$DEPENDENCY_GROUPS"
          uv sync --locked --no-default-groups "${dependency_groups[@]}" --python "$PYTHON_VERSION"
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          DEPENDENCY_GROUPS: ${{ matrix.groups }}

      - name: Run Test Suite
        run: uv run --no-sync pytest -rs
        env:
          HYPOTHESIS_PROFILE: ci

  workflow-narrator:
    name: 🔉 Workflow Narrator
    needs: [labeler, rust-checks, python-checks]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # sparse checkout of .github/scripts
      actions: read # narrator.mjs lists the run's jobs
      pull-requests: write # narrator.mjs creates or updates the summary comment
    env:
      NARRATOR_JOB_NAME: 🔉 Workflow Narrator
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Publish Workflow Summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { default: narrate } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/narrator.mjs`);
            await narrate({ github, context, core });
