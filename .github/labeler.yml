github:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

rust:
  - changed-files:
      - any-glob-to-any-file:
          - crates/mboxturbo/**
          - crates/mboxturbo-py/src/**/*.rs
          - Cargo.toml
          - Cargo.lock
          - clippy.toml
          - rustfmt.toml
          - rust-toolchain.toml

python:
  - changed-files:
      - any-glob-to-any-file:
          - crates/mboxturbo-py/src/mboxturbo/**
          - pyproject.toml
          - uv.lock
          - ruff.toml
          - .python-version

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "**/tests/**"
          - "**/conftest.py"
          - "**/test_*.py"

scripts:
  - changed-files:
      - any-glob-to-any-file:
          - scripts/**
