[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.95
unused-allowed-license = "deny"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
skip = [
    { crate = "getrandom@0.2.17", reason = "older of three; pulled by arrow-array/parquet -> ahash 0.8.12 -> const-random -> const-random-macro; newest 0.4.3 stays checked" },
    { crate = "getrandom@0.3.4", reason = "older of three; pulled by arrow-array/parquet -> ahash 0.8.12; newest 0.4.3 (tempfile, proptest -> rand, parquet -> zstd -> cc -> jobserver) stays checked" },
    { crate = "r-efi@5.3.0", reason = "older of two; pulled by getrandom 0.3.4 via arrow-array/parquet -> ahash 0.8.12; newest 6.0.0 (via getrandom 0.4.3) stays checked" },
    { crate = "syn@2.0.119", reason = "older of two; pulled by arrow-array/parquet -> chrono -> iana-time-zone -> windows-core -> windows-implement/windows-interface, and arrow-array/parquet -> ahash/half -> zerocopy -> zerocopy-derive; newest 3.0.9 (mail-parser -> hashify, pyo3 -> pyo3-macros, thiserror -> thiserror-impl) stays checked" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
