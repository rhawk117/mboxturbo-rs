[workspace]
resolver = "3"
members = ["crates/mboxturbo", "crates/mboxturbo-py"]

[workspace.package]
version = "0.1.0"
authors = ["rhawk117 <noplaceLike127dot0dot0dot1@proton.me>"]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/rhawk117/mboxturbo"
readme = "README.md"
keywords = ["mbox", "email", "mailbox", "forensics", "index"]
categories = ["email", "parser-implementations", "filesystem"]

[workspace.lints.rust]
unsafe_code = "deny"
non_ascii_idents = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
unused_import_braces = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
variant_size_differences = "deny"
unknown_lints = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
mixed_read_write_in_expression = "deny"
mod_module_files = "deny"
multiple_inherent_impl = "deny"
mutex_atomic = "deny"
panic = "deny"
panic_in_result_fn = "deny"
partial_pub_fields = "deny"
print_stderr = "deny"
print_stdout = "deny"
rc_buffer = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
shadow_unrelated = "deny"
string_add = "deny"
string_slice = "deny"
tests_outside_test_module = "deny"
todo = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unneeded_field_pattern = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
use_debug = "deny"
verbose_file_reads = "deny"
wildcard_enum_match_arm = "deny"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = "line-tables-only"
