[workspace]
resolver = "3"
members = ["crates/mboxturbo", "crates/mboxturbo-py"]

[workspace.package]
version = "0.1.0"
authors = ["rhawk117 <noplaceLike127dot0dot0dot1@proton.me>"]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/rhawk117/mboxturbo"
readme = "README.md"
keywords = ["mbox", "email", "mailbox", "forensics", "index"]
categories = ["email", "parser-implementations", "filesystem"]

[workspace.lints.rust]
unsafe_code = "deny"
non_ascii_idents = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
unused_import_braces = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
variant_size_differences = "deny"
unknown_lints = "deny"
warnings = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
unused_results = "deny"
missing_copy_implementations = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_unsafe_on_extern = "deny"
unsafe_attr_outside_unsafe = "deny"
deprecated_safe_2024 = "deny"
keyword_idents = { level = "deny", priority = -1 }
macro_use_extern_crate = "deny"
missing_abi = "deny"
unstable_features = "deny"
ffi_unwind_calls = "deny"
impl_trait_redundant_captures = "deny"
redundant_imports = "deny"
if_let_rescope = "deny"
tail_expr_drop_order = "deny"
unused_extern_crates = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"
redundant_explicit_links = "deny"
private_doc_tests = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# The whole restriction group, the equivalent of ruff's ALL. Everything below set to "allow"
# contradicts another restriction lint or a convention in .claude/rules/rust/, never "too noisy".
restriction = { level = "deny", priority = -1 }
# Contradicts clippy::needless_return (style); the codebase returns by tail expression.
implicit_return = "allow"
# Bans `?`, the propagation rust.md convention 1 prescribes.
question_mark_used = "allow"
# Bans single-use helpers, the extraction rust.md convention 8 prescribes.
single_call_fn = "allow"
# Pair with pub_without_shorthand: the codebase writes `pub(crate)`, so that one stays denied.
pub_with_shorthand = "allow"
# Pair with unseparated_literal_suffix: `1_u32` is the house style, so that one stays denied.
separated_literal_suffix = "allow"
# Pair with mod_module_files (denied): modules are `name.rs`, never `name/mod.rs`.
self_named_module_files = "allow"
# Pair with ref_patterns: matching through a reference needs either `ref` or match ergonomics.
pattern_type_mismatch = "allow"
# Pair with big_endian_bytes and host_endian_bytes: the index format is little-endian on purpose.
little_endian_bytes = "allow"
# Both crates link std; core and alloc paths buy nothing.
std_instead_of_core = "allow"
std_instead_of_alloc = "allow"
# lto = "fat" with codegen-units = 1 already inlines across crates.
missing_inline_in_public_items = "allow"
# Forces re-implementing every provided trait method.
missing_trait_methods = "allow"
# lib.rs is the public facade and re-exports the API by design.
pub_use = "allow"
# Inline `#[cfg(test)] mod tests` is required by tests_outside_test_module and rust-tests.md.
inline_modules = "allow"
# The lint that warns about enabling this group.
blanket_clippy_restriction_lints = "allow"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = "line-tables-only"
